stages:
  - sync
  - check
  - build

variables:
  YCR_PATH: cr.yandex/crpvhgo33ec1f8rrvb74/if-navigation-miniapp
  TAG: $YCR_PATH:$CI_COMMIT_SHORT_SHA.$CI_ENVIRONMENT_NAME

cache: &global_cache
  paths:
    - node_modules
  policy: pull-push

.check_base:
  image: node:22-alpine
  tags:
    - gitlab-lms
  cache:
    <<: *global_cache
    policy: pull
  before_script:
    - npm ci

sync-tag-popularity:
  stage: sync
  image: node:22-alpine
  tags:
    - gitlab-lms
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  before_script:
    - apk add --no-cache git
  script:
    - |
      if [ -z "${METRIKA_OAUTH_TOKEN}" ] || [ -z "${METRIKA_COUNTER_ID}" ]; then
        echo "METRIKA_OAUTH_TOKEN / METRIKA_COUNTER_ID не заданы в CI/CD Variables — пропускаю синхронизацию."
        exit 0
      fi
      if [ -z "${GITLAB_PUSH_TOKEN}" ]; then
        echo "GITLAB_PUSH_TOKEN не задан в CI/CD Variables — некуда пушить результат."
        exit 0
      fi
    - node scripts/sync-tag-popularity.mjs
    - git config user.email "ci@investfuture.ru"
    - git config user.name "GitLab CI (tag popularity sync)"
    - git add public/data/tag-popularity.json
    - |
      if git diff --cached --quiet; then
        echo "Порядок тегов не изменился — коммит не нужен."
      else
        git commit -m "chore: еженедельное обновление порядка тегов по кликам"
        git push "https://oauth2:${GITLAB_PUSH_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:${CI_DEFAULT_BRANCH}
      fi

check-app:
  extends: .check_base
  stage: check
  script:
    - npm run lint
    - npm run build
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

build-docker:
  stage: build
  needs:
    - check-app
  image: docker:24-cli
  services:
    - name: docker:24-dind
      alias: docker
      command: ["--tls=false"]
      variables:
        HEALTHCHECK_TCP_PORT: "2375"
  tags:
    - gitlab-lms
  environment:
    name: production
    action: prepare
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
    DOCKER_TLS_VERIFY: ""
    DOCKER_CERT_PATH: ""
  before_script:
    - unset DOCKER_TLS_VERIFY DOCKER_CERT_PATH
    - |
      dind_wait_attempts=30
      until docker info >/dev/null 2>/tmp/miniapp-dind-error.log; do
        dind_wait_attempts=$((dind_wait_attempts - 1))
        if [ "$dind_wait_attempts" -le 0 ]; then
          echo "Docker-in-Docker did not become ready. Last connection error:" >&2
          cat /tmp/miniapp-dind-error.log >&2
          exit 1
        fi
        echo "Waiting for Docker-in-Docker..."
        sleep 2
      done
    - |
      if [ -z "${YCR_JSON_KEY:-}" ]; then
        echo "YCR_JSON_KEY must contain Docker config JSON with push access to cr.yandex."
        exit 1
      fi
      umask 077
      export DOCKER_CONFIG="$(mktemp -d)"
      trap 'rm -rf "$DOCKER_CONFIG"' EXIT
      if [ -f "$YCR_JSON_KEY" ]; then
        cat "$YCR_JSON_KEY" > "$DOCKER_CONFIG/config.json"
      else
        printf '%s' "$YCR_JSON_KEY" > "$DOCKER_CONFIG/config.json"
      fi
  script:
    - |
      docker build \
        --build-arg VITE_APP_TITLE="${VITE_APP_TITLE}" \
        --build-arg VITE_TELEGRAM_BOT_USERNAME="${VITE_TELEGRAM_BOT_USERNAME}" \
        --build-arg VITE_ANALYTICS_WEBHOOK_URL="${VITE_ANALYTICS_WEBHOOK_URL}" \
        -t "${TAG}" \
        .
    - docker push "${TAG}"
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true
