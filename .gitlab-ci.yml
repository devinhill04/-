stages:
  - check
  - build
  - deploy

variables:
  DOCKER_REGISTRY_IMAGE: ${CI_REGISTRY_IMAGE}
  DEPLOY_PATH: /opt/if-navigation-miniapp

cache: &global_cache
  paths:
    - node_modules
  policy: pull-push

.check_base:
  image: node:22-alpine
  tags:
    - gitlab-lms
  cache:
    <<: *global_cache
    policy: pull
  before_script:
    - npm install

check-lint:
  extends: .check_base
  stage: check
  script:
    - npm run lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

build-docker:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  tags:
    - gitlab-lms
  variables:
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - |
      docker build \
        --build-arg VITE_APP_TITLE="${VITE_APP_TITLE}" \
        --build-arg VITE_TELEGRAM_BOT_USERNAME="${VITE_TELEGRAM_BOT_USERNAME}" \
        --build-arg VITE_ANALYTICS_WEBHOOK_URL="${VITE_ANALYTICS_WEBHOOK_URL}" \
        -t ${DOCKER_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA} \
        -t ${DOCKER_REGISTRY_IMAGE}:latest \
        .
    - docker push ${DOCKER_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}
    - docker push ${DOCKER_REGISTRY_IMAGE}:latest
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

deploy:
  stage: deploy
  image: alpine:latest
  tags:
    - gitlab-lms
  needs:
    - build-docker
  before_script:
    - apk add --no-cache openssh-client
    - |
      if [ -z "${DEPLOY_SERVER}" ]; then
        echo "FATAL: DEPLOY_SERVER is empty. Check GitLab CI/CD Variables."
        exit 1
      fi
      if [ -z "${DEPLOY_USER}" ]; then
        echo "FATAL: DEPLOY_USER is empty. Check GitLab CI/CD Variables."
        exit 1
      fi
      if [ -z "${SSH_PRIVATE_KEY}" ]; then
        echo "FATAL: SSH_PRIVATE_KEY is empty. Check GitLab CI/CD Variables."
        exit 1
      fi
      echo "DEPLOY_SERVER=${DEPLOY_SERVER}"
      echo "DEPLOY_USER=${DEPLOY_USER}"
      echo "DEPLOY_PATH=${DEPLOY_PATH}"
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H ${DEPLOY_SERVER} >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh ${DEPLOY_USER}@${DEPLOY_SERVER} "mkdir -p ${DEPLOY_PATH}"
    - scp docker-compose.yml ${DEPLOY_USER}@${DEPLOY_SERVER}:${DEPLOY_PATH}/
    - |
      ssh ${DEPLOY_USER}@${DEPLOY_SERVER} bash -s \
        "${DOCKER_REGISTRY_IMAGE}" \
        "${CI_COMMIT_SHORT_SHA}" \
        "${CI_REGISTRY_USER}" \
        "${CI_REGISTRY_PASSWORD}" \
        "${CI_REGISTRY}" \
        "${DEPLOY_PATH}" <<'EOF'
        set -e
        DOCKER_REGISTRY_IMAGE="$1"
        CI_COMMIT_SHORT_SHA="$2"
        CI_REGISTRY_USER="$3"
        CI_REGISTRY_PASSWORD="$4"
        CI_REGISTRY="$5"
        DEPLOY_PATH="$6"

        DOCKER_IMAGE_FULL="${DOCKER_REGISTRY_IMAGE}:${CI_COMMIT_SHORT_SHA}"
        COMPOSE_FILE="docker-compose.yml"
        NETWORK_NAME="if-navigation-miniapp"
        CONTAINER_NAME="if-navigation-miniapp"

        mkdir -p "${DEPLOY_PATH}"
        cd "${DEPLOY_PATH}"

        echo "DEBUG: DOCKER_IMAGE_FULL=${DOCKER_IMAGE_FULL}"

        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker pull "${DOCKER_IMAGE_FULL}"
        docker network inspect "${NETWORK_NAME}" >/dev/null 2>&1 || docker network create "${NETWORK_NAME}"

        export DOCKER_IMAGE="${DOCKER_IMAGE_FULL}"

        if ! docker compose -f "${COMPOSE_FILE}" up -d --force-recreate "${CONTAINER_NAME}"; then
          docker stop "${CONTAINER_NAME}" 2>/dev/null || true
          docker rm -f "${CONTAINER_NAME}" 2>/dev/null || true
          docker compose -f "${COMPOSE_FILE}" up -d --force-recreate "${CONTAINER_NAME}"
        fi

        sleep 5
        docker compose -f "${COMPOSE_FILE}" ps

        if ! docker ps --format '{{.Names}}' | grep -qx "${CONTAINER_NAME}"; then
          echo "ERROR: container ${CONTAINER_NAME} is not running"
          exit 1
        fi

        docker image prune -af --filter "until=24h" || true
        echo "Deploy completed: ${CONTAINER_NAME} -> 127.0.0.1:8080"
      EOF
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
